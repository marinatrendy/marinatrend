<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopWithUs - Home</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }

        header {
            background-color: #ff7f50;
            padding: 20px;
            text-align: center;
            color: white;
        }

        .product-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .product-item {
            background-color: white;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .product-item img {
            width: 100%;
            height: auto;
            border-radius: 5px;
        }

        .product-item h3 {
            margin-top: 10px;
            color: #333;
        }

        .product-item p {
            color: #555;
        }

        .product-item a {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 16px;
            background-color: #ff7f50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .product-item a:hover {
            background-color: #ff6347;
        }
    </style>
</head>
<body>

<header>
    <h1>ShopWithUs - Our Products</h1>
</header>

<div class="product-list">
    <div class="product-item">
        <img src="" alt="Product 1">
        <h3>skirt</h3>
        <p>$29.99</p>
        <a href="product-details.html?product=1">View Details</a>
    </div>
    <div class="product-item">
        <img src="https://via.placeholder.com/250x250?text=Product+2" alt="Product 2">
        <h3>Product 2</h3>
        <p>$49.99</p>
        <a href="product-details.html?product=2">View Details</a>
    </div>
    <div class="product-item">
        <img src="https://via.placeholder.com/250x250?text=Product+3" alt="Product 3">
        <h3>Product 3</h3>
        <p>$69.99</p>
        <a href="product-details.html?product=3">View Details</a>
    </div>
    <div class="product-item">
        <img src="https://via.placeholder.com/250x250?text=Product+3" alt="Product 3">
        <h3>Product 4</h3>
        <p>Rs.155</p>
        <a href="product-details.html?product=4">View Details</a>
    </div>
    <!-- Add more products as needed -->
</div>

</body>
</html>
